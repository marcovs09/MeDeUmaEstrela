<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⭐ Criar conta — Me dê uma estrela</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/cadastro.css" />
</head>
<body>
    <div class="auth-container">
        <div class="stars-bg"></div>

        <div class="auth-card">
            <a href="index.html" class="back-home">← Voltar</a>

            <h2 class="auth-title">Crie sua conta ⭐</h2>

            <form id="cadastroForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Nome de usuário</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Digite seu nome de usuário"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                        required
                        minlength="6"
                    />
                </div>

                <div class="form-group">
                    <label>Escolha seu personagem</label>
                    <div class="avatar-grid avatar-grid-cadastro" id="avatarGrid">
                        <!-- Avatares serão gerados via JS -->
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Criar minha conta ⭐
                </button>
            </form>

            <p class="auth-footer">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/avatars.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
